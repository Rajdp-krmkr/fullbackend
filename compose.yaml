
services:

  # --------------------------
  # Express instance 1
  # --------------------------
  express1:
    build: .
    environment:
      PORT: "3000"
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # --------------------------
  # Express instance 2
  # --------------------------
  express2:
    build: .
    environment:
      PORT: "3000"
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # --------------------------
  # Express instance 3
  # --------------------------
  express3:
    build: .
    environment:
      PORT: "3000"
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # --------------------------
  # Redis
  # --------------------------
  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # --------------------------
  # Nginx
  # --------------------------
  nginx:
    image: nginx:stable
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_cache:/var/cache/nginx/mycache
    depends_on:
      - express1
      - express2
      - express3
    restart: unless-stopped


# --------------------------
# Persistent storage
# --------------------------
volumes:
  redis_data:
  nginx_cache:
